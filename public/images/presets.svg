<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <linearGradient id="graded" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5a3a"/>
      <stop offset="0.55" stop-color="#c9922e"/>
      <stop offset="1" stop-color="#e6c47a"/>
    </linearGradient>
    <linearGradient id="flat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2c2823"/>
      <stop offset="1" stop-color="#4a443c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="#1a1816"/>

  <text x="56" y="88" fill="#857c6e" font-size="17" letter-spacing="5">40 PRESETS · BEFORE / AFTER</text>
  <line x1="56" y1="118" x2="1144" y2="118" stroke="#2c2823" stroke-width="2"/>

  <!-- film strip -->
  <rect x="56" y="158" width="1088" height="340" fill="#232019"/>
  <g fill="#1a1816">
    <rect x="80" y="174" width="26" height="18"/><rect x="140" y="174" width="26" height="18"/>
    <rect x="200" y="174" width="26" height="18"/><rect x="260" y="174" width="26" height="18"/>
    <rect x="320" y="174" width="26" height="18"/><rect x="380" y="174" width="26" height="18"/>
    <rect x="440" y="174" width="26" height="18"/><rect x="500" y="174" width="26" height="18"/>
    <rect x="560" y="174" width="26" height="18"/><rect x="620" y="174" width="26" height="18"/>
    <rect x="680" y="174" width="26" height="18"/><rect x="740" y="174" width="26" height="18"/>
    <rect x="800" y="174" width="26" height="18"/><rect x="860" y="174" width="26" height="18"/>
    <rect x="920" y="174" width="26" height="18"/><rect x="980" y="174" width="26" height="18"/>
    <rect x="1040" y="174" width="26" height="18"/><rect x="1100" y="174" width="26" height="18"/>
    <rect x="80" y="464" width="26" height="18"/><rect x="140" y="464" width="26" height="18"/>
    <rect x="200" y="464" width="26" height="18"/><rect x="260" y="464" width="26" height="18"/>
    <rect x="320" y="464" width="26" height="18"/><rect x="380" y="464" width="26" height="18"/>
    <rect x="440" y="464" width="26" height="18"/><rect x="500" y="464" width="26" height="18"/>
    <rect x="560" y="464" width="26" height="18"/><rect x="620" y="464" width="26" height="18"/>
    <rect x="680" y="464" width="26" height="18"/><rect x="740" y="464" width="26" height="18"/>
    <rect x="800" y="464" width="26" height="18"/><rect x="860" y="464" width="26" height="18"/>
    <rect x="920" y="464" width="26" height="18"/><rect x="980" y="464" width="26" height="18"/>
    <rect x="1040" y="464" width="26" height="18"/><rect x="1100" y="464" width="26" height="18"/>
  </g>

  <!-- frame 1: ungraded -->
  <rect x="88" y="212" width="320" height="232" fill="url(#flat)"/>
  <circle cx="150" cy="270" r="20" fill="#5b544a"/>
  <path d="M88 400 l86 -70 74 56 66 -44 94 62 v40 h-320 z" fill="#3a352e"/>
  <text x="88" y="480" fill="#857c6e" font-size="15" letter-spacing="3">STRAIGHT OUT OF CAMERA</text>

  <!-- frame 2 + 3: graded -->
  <rect x="440" y="212" width="320" height="232" fill="url(#graded)"/>
  <circle cx="502" cy="270" r="20" fill="#fbe9c3"/>
  <path d="M440 400 l86 -70 74 56 66 -44 94 62 v40 h-320 z" fill="#6b4d19" opacity="0.85"/>
  <text x="440" y="480" fill="#c9922e" font-size="15" letter-spacing="3">PRESET 12 — DUSK</text>

  <rect x="792" y="212" width="320" height="232" fill="url(#graded)" opacity="0.72"/>
  <circle cx="854" cy="270" r="20" fill="#fbe9c3" opacity="0.85"/>
  <path d="M792 400 l86 -70 74 56 66 -44 94 62 v40 h-320 z" fill="#6b4d19" opacity="0.7"/>
  <text x="792" y="480" fill="#857c6e" font-size="15" letter-spacing="3">PRESET 27 — SMOKE</text>

  <!-- tone curve -->
  <g transform="translate(56,540)">
    <rect width="200" height="130" fill="none" stroke="#2c2823" stroke-width="2"/>
    <line x1="0" y1="130" x2="200" y2="0" stroke="#40392f" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M0 130 C 46 92, 70 40, 118 34 S 172 14, 200 0" fill="none" stroke="#c9922e" stroke-width="3"/>
    <circle cx="118" cy="34" r="5" fill="#c9922e"/>
  </g>
  <text x="288" y="580" fill="#ede7dc" font-size="26" letter-spacing="-0.5">One click, both apps</text>
  <text x="288" y="614" fill="#a29888" font-size="17">Desktop and mobile Lightroom · free app supported</text>
  <text x="288" y="656" fill="#857c6e" font-size="15" letter-spacing="3">.XMP + .DNG INCLUDED</text>

  <rect x="1" y="1" width="1198" height="718" fill="none" stroke="#2c2823" stroke-width="2"/>
